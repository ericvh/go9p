name: docker-ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # Pin the kernel version so BuildKit layer caching remains stable across commits.
  # Bump this intentionally when you want to test a newer kernel.
  KERNEL9P_LINUX_VERSION: "7.0"

jobs:
  docker-test:
    name: docker (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [test, race]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check HERZOG.md mirrors README.md
        run: bash ./scripts/check-herzog-sync.sh

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          load: true
          tags: go9p:${{ matrix.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run ${{ matrix.target }}
        run: docker run --rm go9p:${{ matrix.target }}

  kernel9p-qemu:
    # arm64-only kernel-client testing for now.
    name: kernel9p-qemu (arm64)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check HERZOG.md mirrors README.md
        run: bash ./scripts/check-herzog-sync.sh

      - name: Build kernel9p-test image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.kernel9p-qemu
          # Use v9fs/test prebuilt kernel (Image asset).
          target: kernel9p-test-v9fs
          # Pin the image OS/CPU to the runner matrix. Without this, Buildx can
          # default to linux/amd64 even on arm64 jobs (or vice versa), so
          # `load: true` ends up with the wrong architecture for that runner.
          platforms: linux/${{ matrix.arch }}
          build-args: |
            KERNEL_ARCH=${{ matrix.arch }}
            LINUX_VERSION=${{ env.KERNEL9P_LINUX_VERSION }}
            V9FS_TEST_KERNEL_TAG=kernel-main
          load: true
          tags: go9p:kernel9p-${{ matrix.arch }}
          # Use a cache scope keyed by arch+kernel version to maximize reuse.
          cache-from: type=gha,scope=kernel9p-${{ matrix.arch }}-${{ env.KERNEL9P_LINUX_VERSION }}
          cache-to: type=gha,scope=kernel9p-${{ matrix.arch }}-${{ env.KERNEL9P_LINUX_VERSION }},mode=max

      - name: Run kernel9p-test (${{ matrix.arch }}, qemu)
        run: docker run --rm --platform linux/${{ matrix.arch }} -e KERNEL9P_SERVER=qemu go9p:kernel9p-${{ matrix.arch }}

      - name: Run kernel9p-test (${{ matrix.arch }}, go9p-ufs)
        run: docker run --rm --platform linux/${{ matrix.arch }} -e KERNEL9P_SERVER=go9p-ufs go9p:kernel9p-${{ matrix.arch }}

